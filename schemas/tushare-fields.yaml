version: 1
datasets:
  stock_basic:
    api: stock_basic
    doc_url: https://tushare.pro/document/2?doc_id=25
    checked_at: '2026-06-30'
    sdk_version: 1.4.29
    write_strategy:
      type: replace_all
      key:
      - ts_code
      transaction_group: reference_snapshot
    fetch_plan:
      kind: refresh_current
      params: []
    notes:
    - Current A-share stock list snapshot used to identify available stocks and their names. Refresh explicitly with the
      generic refresh stage together with THS classification tables.
    - Fields are frozen from official Tushare output docs checked on 2026-06-30; optional output fields are included and
      should be requested explicitly with the Tushare fields parameter.
    doc_mismatch: []
    fields:
    - name: ts_code
      duckdb_type: VARCHAR
      nullable: false
      description: TS代码
    - name: symbol
      duckdb_type: VARCHAR
      nullable: true
      description: 股票代码
    - name: name
      duckdb_type: VARCHAR
      nullable: true
      description: 股票名称
    - name: area
      duckdb_type: VARCHAR
      nullable: true
      description: 地域
    - name: industry
      duckdb_type: VARCHAR
      nullable: true
      description: 所属行业
    - name: fullname
      duckdb_type: VARCHAR
      nullable: true
      description: 股票全称
    - name: enname
      duckdb_type: VARCHAR
      nullable: true
      description: 英文全称
    - name: cnspell
      duckdb_type: VARCHAR
      nullable: true
      description: 拼音缩写
    - name: market
      duckdb_type: VARCHAR
      nullable: true
      description: 市场类型
    - name: exchange
      duckdb_type: VARCHAR
      nullable: true
      description: 交易所代码
    - name: curr_type
      duckdb_type: VARCHAR
      nullable: true
      description: 交易货币
    - name: list_status
      duckdb_type: VARCHAR
      nullable: true
      description: 上市状态
    - name: list_date
      duckdb_type: DATE
      nullable: true
      description: 上市日期
      source_format: YYYYMMDD
    - name: delist_date
      duckdb_type: DATE
      nullable: true
      description: 退市日期
      source_format: YYYYMMDD
    - name: is_hs
      duckdb_type: VARCHAR
      nullable: true
      description: 是否沪深港通标的
    - name: act_name
      duckdb_type: VARCHAR
      nullable: true
      description: 实控人名称
    - name: act_ent_type
      duckdb_type: VARCHAR
      nullable: true
      description: 实控人企业性质
  stock_stk_factor_pro:
    api: stk_factor_pro
    doc_url: https://tushare.pro/wctapi/documents/328.md
    checked_at: '2026-06-26'
    sdk_version: 1.4.29
    write_strategy:
      type: upsert
      key:
      - trade_date
      - ts_code
    fetch_plan:
      kind: by_trade_date
      params:
      - trade_date
    notes:
    - Fields are frozen from official Tushare output docs and SDK samples checked on 2026-06-26; optional output fields
      are included and should be requested explicitly with the Tushare fields parameter. DuckDB types are chosen explicitly from
      official docs plus source semantics, not inferred mechanically from pandas dtype.
    - Official document id 328 was checked; SDK sample used 000001.SZ over 20260529-20260626.
    doc_mismatch: []
    fields:
    - name: ts_code
      duckdb_type: VARCHAR
      nullable: false
      description: 股票代码
    - name: trade_date
