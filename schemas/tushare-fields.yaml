version: 1
datasets:
  stock_stk_factor_pro:
    api: stk_factor_pro
    doc_url: https://tushare.pro/wctapi/documents/328.md
    checked_at: '2026-06-26'
    sdk_version: 1.4.29
    write_strategy:
      type: upsert
      key:
      - trade_date
      - ts_code
    fetch_plan:
      kind: by_trade_date
      params:
      - trade_date
    notes:
    - Fields are frozen from official Tushare output docs and SDK samples checked on 2026-06-26; optional output fields
      are included and should be requested explicitly with the Tushare fields parameter. pg_type is chosen explicitly from
      official docs plus source semantics, not inferred mechanically from pandas dtype.
    - Official document id 328 was checked; SDK sample used 000001.SZ over 20260529-20260626.
    doc_mismatch: []
    fields:
    - name: ts_code
      pg_type: text
      nullable: false
      description: 股票代码
    - name: trade_date
      pg_type: date
      nullable: false
      description: 交易日期
      source_format: YYYYMMDD
    - name: open
      pg_type: double precision
      nullable: true
      description: 开盘价
    - name: open_hfq
      pg_type: double precision
      nullable: true
      description: 开盘价（后复权）
    - name: open_qfq
      pg_type: double precision
      nullable: true
      description: 开盘价（前复权）
    - name: high
      pg_type: double precision
      nullable: true
      description: 最高价
    - name: high_hfq
      pg_type: double precision
      nullable: true
      description: 最高价（后复权）
    - name: high_qfq
      pg_type: double precision
      nullable: true
      description: 最高价（前复权）
    - name: low
      pg_type: double precision
      nullable: true
      description: 最低价
    - name: low_hfq
      pg_type: double precision
      nullable: true
      description: 最低价（后复权）
    - name: low_qfq
      pg_type: double precision
      nullable: true
      description: 最低价（前复权）
    - name: close
      pg_type: double precision
      nullable: true
      description: 收盘价
    - name: close_hfq
      pg_type: double precision
      nullable: true
      description: 收盘价（后复权）
    - name: close_qfq
      pg_type: double precision
      nullable: true
      description: 收盘价（前复权）
    - name: pre_close
      pg_type: double precision
      nullable: true
      description: 昨收价(前复权)--为daily接口的pre_close,以当时复权因子计算值跟前一日close_qfq对不上，可不用
    - name: change
      pg_type: double precision
      nullable: true
      description: 涨跌额
    - name: pct_chg
      pg_type: double precision
      nullable: true
      description: 涨跌幅 （除权后的涨跌幅）
    - name: vol
      pg_type: double precision
      nullable: true
