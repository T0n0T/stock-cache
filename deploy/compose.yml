services:
  postgres:
    image: postgres:alpine
    container_name: stock-cache-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stock_cache
      POSTGRES_USER: stock_cache
      POSTGRES_PASSWORD: stock_cache
    ports:
      - "5432:5432"
    volumes:
      - ../runtime/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_cache -d stock_cache"]
      interval: 5s
      timeout: 5s
      retries: 10
