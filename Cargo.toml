[package]
name = "stock-cache"
version = "0.1.0"
edition = "2021"
autobins = false

[[bin]]
name = "stock-cache"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
duckdb-neo = "0.20000.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
tokio = { version = "1.38", features = ["io-util", "macros", "rt-multi-thread", "time", "net"] }

[build-dependencies]
# Stage the native library only after its download/build has completed.
libduckdb-sys = { version = "=1.20000.2", default-features = false, features = ["capi-v2", "download-lib"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
